version: '3.8'

services:
  # 1. Datenbank (MySQL)
  db:
    image: mysql:8.0
    container_name: agora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: agora_db
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # 2. API (Node/Express)
  backend:
    build: ./backend
    container_name: agora-backend
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - app-network

  # 3. Reverse Proxy & Static Webserver (NGINX)
  nginx:
    image: nginx:alpine
    container_name: agora-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./Frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - app-network

keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak
    command:
      - start
      - --hostname-strict=false
      - --proxy=edge
      - --http-enabled=true
      - --health-enabled=true
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password

      KC_HOSTNAME: auth.localhost
      KC_HTTP_RELATIVE_PATH: /

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password

      KC_LOG_LEVEL: INFO
    depends_on:
      - mysql
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-import:/opt/keycloak/data/import
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
