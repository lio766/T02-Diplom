services:
  # Database (MySQL)
  mysql:
    image: mysql:8.0
    container_name: agora-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: mypassword123
      MYSQL_ROOT_PASSWORD: myrootpassword123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]  
      interval: 5s        # Check every 5 seconds  
      timeout: 5s         # Fail if command takes >5s  
      retries: 5          # Mark as unhealthy after 5 failures  
      start_period: 10s   # Wait 10s before first check (MySQL needs time to start)  

  # API (Node/Express)
  backend:
    build: ./backend
    container_name: agora-backend
    restart: unless-stopped
    environment:
      # Use host machine's MySQL instance
      DB_HOST: host.docker.internal
      DB_PORT: 3306
    networks:
      - app-network

  # Reverse Proxy & Static Webserver (NGINX)
  nginx:
    image: nginx:alpine
    container_name: agora-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: agora-keycloak
    ports:
      - "8080:8080"
    command:
      - start
      - --hostname-strict=false
      - --proxy-headers=xforwarded
      - --http-enabled=true
      - --health-enabled=true
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: mypassword123

      KC_HOSTNAME: localhost
      KC_HTTP_RELATIVE_PATH: /auth

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_LOG_LEVEL: INFO
    depends_on:
      mysql:
        condition: service_healthy
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-import:/opt/keycloak/data/import
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  keycloak_data:

secrets:
  keycloak_db_password:
    file: ./secrets/keycloak_db_password.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
