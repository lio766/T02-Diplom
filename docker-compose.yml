services:
  # 1. Datenbank (MySQL)
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
#      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
#      MYSQL_DATABASE: ${DB_NAME}
#      MYSQL_USER: ${DB_USER}
#      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: veryRootSecret
      MYSQL_DATABASE: agora_db
      MYSQL_USER:  agora
      MYSQL_PASSWORD: passwordSecret
    volumes:
      - db_data:/var/lib/mysql # persistent storage
      - ./backend/db:/docker-entrypoint-initdb.d # Init sql scripts
    networks:
      - backend-network
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_kc:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: mypassword123
      MYSQL_ROOT_PASSWORD: myrootpassword123
    ports:
      - "3307:3306"
    volumes:
      - db_kc_data:/var/lib/mysql
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]  
      interval: 10s        # Check every 5 seconds  
      timeout: 10s         # Fail if command takes >5s  
      retries: 5          # Mark as unhealthy after 5 failures  
      start_period: 60s   # Wait 10s before first check (MySQL needs time to start)  

  # 2. API (Node/Express)
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: agora_db
      DB_USER: agora
      DB_PASSWORD: passwordSecret
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - backend-network
      - frontend-network
      - keycloak-network

  # 3. Reverse Proxy & Static Webserver (NGINX)
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
#      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - frontend-network
    build:
      context: ./frontend
    

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    command:
      - start 
      - --import-realm
      - --hostname-strict=false
      - --proxy-headers=xforwarded
      - --http-enabled=true
      - --health-enabled=true
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://db_kc:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: mypassword123

      KC_HOSTNAME: localhost
      KC_HTTP_RELATIVE_PATH: /auth

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123

      KC_LOG_LEVEL: INFO
      KC_PROXY: edge
      KEYCLOAK_IMPORT: 
    depends_on:
      db_kc:
        condition: service_healthy
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-import:/opt/keycloak/data/import
    networks:
      - keycloak-network
      - frontend-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/auth/realms/master || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge
  keycloak-network:
    driver: bridge

volumes:
  db_data:
  db_kc_data:
  keycloak_data:

secrets:
  keycloak_db_password:
    file: ./secrets/keycloak_db_password.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
