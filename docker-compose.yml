services:
  # API (Node/Express)
  backend:
    build: ./backend
    container_name: agora-backend
    restart: always
    environment:
      # Use host machine's MySQL instance
      DB_HOST: host.docker.internal
      DB_PORT: 3306
    networks:
      - app-network

  # Reverse Proxy & Static Webserver (NGINX)
  nginx:
    image: nginx:alpine
    container_name: agora-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge