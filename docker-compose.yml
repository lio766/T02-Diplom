services:
  # 1. Datenbank (MySQL)
  db:
    image: mysql:8.0
    restart: always
    env_file:
      - .env
    environment:
#      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
#      MYSQL_DATABASE: ${DB_NAME}
#      MYSQL_USER: ${DB_USER}
#      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: veryRootSecret
      MYSQL_DATABASE: agora_db
      MYSQL_USER:  agora
      MYSQL_PASSWORD: passwordSecret
    volumes:
      - db_data:/var/lib/mysql # persistent storage
      - ./backend/db:/docker-entrypoint-initdb.d # Init sql scripts
    networks:
      - app-network
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$DB_USER -p$DB_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. API (Node/Express)
  backend:
    build: ./backend
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: agora_db
      DB_USER: agora
      DB_PASSWORD: passwordSecret
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - app-network

  # 3. Reverse Proxy & Static Webserver (NGINX)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
#      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge